<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <rect width="800" height="800" fill="#FFFFFF" rx="32"/>
  
  <!-- Monitor with Circuit Traces Icon -->
  <g transform="translate(220, 60)" fill="#0B4085" stroke="#0B4085">
    <!-- Monitor Outer Body -->
    <rect x="130" y="20" width="230" height="150" rx="16" fill="none" stroke-width="14"/>
    <path d="M 210,170 L 210,195 M 180,195 L 270,195" fill="none" stroke-width="14" stroke-linecap="round"/>
    
    <!-- Circuit Lines Left side -->
    <!-- Trace 1 -->
    <circle cx="20" cy="30" r="10"/>
    <path d="M 20,30 L 70,30 L 100,60 L 130,60" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Trace 2 -->
    <circle cx="45" cy="80" r="10"/>
    <path d="M 45,80 L 130,80" fill="none" stroke-width="7" stroke-linecap="round"/>
    
    <!-- Trace 3 -->
    <circle cx="20" cy="130" r="10"/>
    <path d="M 20,130 L 70,130 L 100,105 L 130,105" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Trace 4 -->
    <circle cx="55" cy="170" r="10"/>
    <path d="M 55,170 L 85,170 L 115,135 L 130,135" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Heading Text -->
  <text x="400" y="300" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Montserrat, sans-serif" font-weight="900" font-size="44" fill="#0A2C59" letter-spacing="2">
    NAPRAWA
  </text>

  <text x="400" y="355" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Montserrat, sans-serif" font-weight="900" font-size="44" fill="#0A2C59" letter-spacing="1">
    KOMPUTERÓW
  </text>

  <text x="400" y="410" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Montserrat, sans-serif" font-weight="900" font-size="44" fill="#0A2C59" letter-spacing="2">
    I LAPTOPÓW
  </text>

  <!-- Subheading / Service Name -->
  <text x="400" y="470" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Montserrat, sans-serif" font-weight="800" font-size="28" fill="#0A2C59" letter-spacing="4">
    SERWIS POGOTOWIE
  </text>

  <text x="400" y="520" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Montserrat, sans-serif" font-weight="800" font-size="32" fill="#0A2C59" letter-spacing="6">
    RAFAŁ JAROSZ
  </text>

  <!-- Website URL -->
  <text x="400" y="575" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Montserrat, sans-serif" font-weight="800" font-size="26" fill="#0A2C59" letter-spacing="3">
    NAPRAWAPCLAPTOP.PL
