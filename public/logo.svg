  <text x="400" y="635" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Montserrat, sans-serif" font-weight="900" font-size="38" fill="#0A2C59" letter-spacing="4">
    786 409 187
  </text>

  <!-- Address Line 1 -->
  <text x="400" y="690" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Montserrat, sans-serif" font-weight="800" font-size="24" fill="#0A2C59" letter-spacing="3">
    WARSZAWA, UL. MARYMONCKA
  </text>

  <!-- Address Line 2 -->
  <text x="400" y="735" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Montserrat, sans-serif" font-weight="800" font-size="24" fill="#0A2C59" letter-spacing="3">
